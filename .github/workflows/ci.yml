name: Uarefake CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/fulfillment-lifecycle

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Intentionally blank: CI must never apply deploy-time migrations to Neon.
      DATABASE_URL: ""
      VITE_AUTH_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # TanStack Router regenerates routeTree.gen.ts during Vite build.
      # Build first so typecheck sees the same generated route types as deploy.
      - name: Production build (database migrations must skip without DATABASE_URL)
        run: npm run build
      - name: TypeScript
        run: npm run typecheck
      - name: Tests (including fulfillment concurrency)
        run: npm test
      - name: Lint
        run: npm run lint
