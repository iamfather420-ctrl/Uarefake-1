name: Import and verify pinned Full-Build source

on:
  push:
    branches:
      - integration/full-build-source-import-20261015
      - integration/package-merged-build-20261015
      - integration/complete-source-snapshot-import-20261015
      - main
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/full-build-source-import.yml"
      - "integrated-sources/Full-Build/**"
      - "integrations/source-repos/**"
      - "docs/FULL-BUILD-SOURCE-INTEGRATION.md"
      - "eslint.config.mjs"

permissions:
  contents: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ""
    steps:
      - name: Checkout canonical target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Import pinned Full-Build source without secrets or generated dependencies
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          SOURCE_SHA="a67017fbfe2ac795dfdc635a434ef50b19852ec8"
          TMP_DIR="$(mktemp -d)"
          git clone --filter=blob:none --no-checkout https://github.com/iamfather420-ctrl/Full-Build.git "$TMP_DIR/Full-Build"
          git -C "$TMP_DIR/Full-Build" checkout --detach "$SOURCE_SHA"
          mkdir -p integrated-sources/Full-Build
          rsync -a \
            --exclude='.git/' \
            --exclude='.agents/' \
            --exclude='.buddy/' \
            --exclude='.gitconfig' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.pem' \
            --exclude='*.key' \
            --exclude='*.p12' \
            --exclude='*.pfx' \
            --exclude='*.db' \
            --exclude='*.sqlite*' \
            --exclude='dist/' \
            --exclude='coverage/' \
            --exclude='.vercel/' \
            --exclude='.cache/' \
            --exclude='.local/' \
            --exclude='.cargo/' \
            "$TMP_DIR/Full-Build/" integrated-sources/Full-Build/
          # Import the audited 36-repository snapshot without local memory, caches, credentials, or generated dependencies.
          AUDIT_DIR="$(mktemp -d)/source-audit"
          git clone --filter=blob:none --no-checkout --branch "integration/cross-repo-purity-match-20261015" --single-branch https://github.com/iamfather420-ctrl/Uarefake-1.git "$AUDIT_DIR"
          git -C "$AUDIT_DIR" checkout --detach "4565b39d12201197cfc01ed19010d49d9c906529"
          mkdir -p integrations/source-repos
          rsync -a \
            --exclude='.git/' \
            --exclude='.agents/' \
            --exclude='.buddy/' \
            --exclude='.gitconfig' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.pem' \
            --exclude='*.key' \
            --exclude='*.p12' \
            --exclude='*.pfx' \
            --exclude='*.db' \
            --exclude='*.sqlite*' \
            --exclude='dist/' \
            --exclude='coverage/' \
            --exclude='.vercel/output/' \
            --exclude='.cache/' \
            --exclude='.local/' \
            --exclude='.cargo/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='artifacts/.tmp/' \
            --exclude='Pasted Text-*.txt' \
            --exclude='.node_modules.lock' \
            "$AUDIT_DIR/integrations/source-repos/" integrations/source-repos/
          SNAPSHOT_FILE_COUNT="$(find integrations/source-repos -type f | wc -l | tr -d ' ')"
          SNAPSHOT_BYTES="$(du -sb integrations/source-repos | cut -f1)"
          cat > integrations/source-repos/SOURCE-SNAPSHOT-PROVENANCE.json <<EOF
          {
            "sourceRepository": "iamfather420-ctrl/Uarefake-1",
            "sourceBranch": "integration/cross-repo-purity-match-20261015",
            "sourceCommit": "4565b39d12201197cfc01ed19010d49d9c906529",
            "sourceSnapshotCount": 36,
            "importedFileCount": $SNAPSHOT_FILE_COUNT,
            "importedBytes": $SNAPSHOT_BYTES,
            "excluded": [".git metadata", ".agents workspace memory", ".buddy deployment workspace", ".gitconfig", "node_modules", ".env files", "credential/certificate files", "local database files", "dist/coverage", ".vercel output", "caches/toolchains", "Python bytecode", "temporary MCP results", "pasted-text attachments", ".node_modules.lock"],
            "disposition": "Isolated source snapshots for provenance and compatibility review; not all source modules are wired into the root runtime."
          }
          EOF
          cat > integrated-sources/Full-Build/SOURCE-PROVENANCE.json <<'EOF'
          {
            "sourceRepository": "iamfather420-ctrl/Full-Build",
            "sourceRef": "main",
            "sourceCommit": "a67017fbfe2ac795dfdc635a434ef50b19852ec8",
            "importMethod": "pinned source copy",
            "sourceImportExcluded": [
              ".git metadata",
              ".agents workspace memory",
              ".buddy deployment workspace",
              ".gitconfig",
              "node_modules",
              ".env files",
              "private key and certificate files",
              "local database files",
              "dist and coverage",
              ".vercel output",
              "caches and toolchains"
            ],
            "packageArtifactExcluded": [
              "attachments/grok-workspace.zip",
              "attachments/Pasted Text-*.txt",
              "artifacts/.tmp tool results",
              ".node_modules.lock",
              ".git metadata",
              "node_modules",
              ".env files",
              "private key and certificate files",
              "local database files",
              "dist and coverage",
              ".vercel output",
              "caches and toolchains",
              ".agents workspace memory",
              ".buddy deployment workspace",
              ".gitconfig"
            ],
            "verification": "npm ci and npm run verify:120 run in the isolated source root; the command executes the 120-case corpus and 46-gate suite. A passing formal corpus does not itself prove production readiness."
          }
          
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrated-sources/Full-Build integrations/source-repos eslint.config.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build(integration): import pinned Full-Build source with provenance"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Install canonical app dependencies
        run: npm ci

      - name: Canonical production build (database migrations stay disabled)
        run: npm run build

      - name: Canonical TypeScript
        run: npm run typecheck

      - name: Canonical tests
        run: npm test

      - name: Canonical lint
        run: npm run lint

      - name: Install pinned Full-Build dependencies
        run: npm ci --prefix integrated-sources/Full-Build

      - name: Rerun original 120-case verifier and 46 gates
        working-directory: integrated-sources/Full-Build
        run: npm run verify:120

      - name: Package merged source tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STAGE_PARENT="$(mktemp -d)"
          STAGE_DIR="$STAGE_PARENT/uarefake-1-merged-source"
          mkdir -p "$STAGE_DIR"
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.pem' \
            --exclude='*.key' \
            --exclude='*.p12' \
            --exclude='*.pfx' \
            --exclude='*.db' \
            --exclude='*.sqlite*' \
            --exclude='dist/' \
            --exclude='coverage/' \
            --exclude='.vercel/' \
            --exclude='.cache/' \
            --exclude='.local/' \
            --exclude='.cargo/' \
            --exclude='.agents/' \
            --exclude='.buddy/' \
            --exclude='.gitconfig' \
            --exclude='attachments/grok-workspace.zip' \
            --exclude='attachments/Pasted Text-*.txt' \
            --exclude='artifacts/.tmp/' \
            --exclude='.node_modules.lock' \
            ./ "$STAGE_DIR/"
          cd "$STAGE_PARENT"
          zip -qr /tmp/uarefake-1-merged-source.zip uarefake-1-merged-source
      - name: Upload merged source build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uarefake-1-merged-source
          path: /tmp/uarefake-1-merged-source.zip
          if-no-files-found: warn

      - name: Upload fresh formal evidence and gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-120-case-revalidation
          path: |
            integrated-sources/Full-Build/artifacts/formal-aggregation.json
            integrated-sources/Full-Build/artifacts/z3-120-formal-verification-summary.json
            integrated-sources/Full-Build/artifacts/z3-120-formal-verification-summary.md
            integrated-sources/Full-Build/artifacts/final-forensic-report.json
            integrated-sources/Full-Build/artifacts/final-forensic-report.md
            integrated-sources/Full-Build/artifacts/system-46-gates.json
            integrated-sources/Full-Build/artifacts/daisy-brain-activation-gate.json
          if-no-files-found: warn
