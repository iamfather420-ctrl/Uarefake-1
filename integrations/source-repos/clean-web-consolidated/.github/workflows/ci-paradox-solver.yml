name: "CI/CD: Paradox Operator Resolver"

on:
  push:
    branches: [ "main", "release/*" ]
    paths:
      - 'deploy/services/paradox-solver/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'deploy/services/paradox-solver/**'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  rust-lint-and-test:
    name: Rust Lint, Test, & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run Cargo Format Check
        run: cargo fmt --manifest-path deploy/services/paradox-solver/Cargo.toml -- --check

      - name: Run Cargo Clippy (Lints)
        run: cargo clippy --manifest-path deploy/services/paradox-solver/Cargo.toml -- -D warnings

      - name: Run Cargo Audit (Vulnerability Check)
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Cargo Tests
        run: cargo test --manifest-path deploy/services/paradox-solver/Cargo.toml --verbose

  containerize-and-publish:
    name: Secure Container Build & Publish
    runs-on: ubuntu-latest
    needs: [rust-lint-and-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./deploy/services/paradox-solver/
          file: ./deploy/services/paradox-solver/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/paradox-solver:latest
            ghcr.io/${{ github.repository }}/paradox-solver:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scan on Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/paradox-solver:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-to-kubernetes:
    name: Deployment to Kubernetes
    runs-on: ubuntu-latest
    needs: [containerize-and-publish]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure Kubectl Connection
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy Cluster Pods
        run: |
          cd deploy/k8s/paradox-solver
          kustomize edit set image paradox-solver=ghcr.io/${{ github.repository }}/paradox-solver:${{ github.sha }}
          kubectl apply -k .
          kubectl rollout status deployment/paradox-solver -n daisy-prod --timeout=300s
