name: "CI/CD: Tether Synaptic RAG"

on:
  push:
    branches: [ "main", "release/*" ]
    paths:
      - 'deploy/services/tether-rag/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'deploy/services/tether-rag/**'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  code-quality:
    name: Code Quality & PEP8 Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Libraries
        run: |
          pip install flake8 black mypy

      - name: Run Flake8 PEP8 Check
        run: flake8 deploy/services/tether-rag/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Black Code Formatting Check
        run: black --check deploy/services/tether-rag/

  security-sast:
    name: Security & Vulnerability Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Bandit (Python SAST)
        run: |
          pip install bandit
          bandit -r deploy/services/tether-rag/ -ll

      - name: Run Safety Check (Dependency Vulns)
        run: |
          pip install safety
          if [ -f deploy/services/tether-rag/requirements.txt ]; then
            safety check -r deploy/services/tether-rag/requirements.txt || true
          fi

  test-unit-integration:
    name: Automated PyTest Suite
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          pip install pytest pytest-cov fastapi httpx
          if [ -f deploy/services/tether-rag/requirements.txt ]; then
            pip install -r deploy/services/tether-rag/requirements.txt
          fi

      - name: Execute Tests & Generate Coverage
        run: |
          pytest deploy/services/tether-rag/ --cov=deploy/services/tether-rag/ --cov-report=xml || true

  containerize-and-publish:
    name: Secure Container Build & Publish
    runs-on: ubuntu-latest
    needs: [test-unit-integration, security-sast]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./deploy/services/tether-rag/
          file: ./deploy/services/tether-rag/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/tether-rag:latest
            ghcr.io/${{ github.repository }}/tether-rag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scan on Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/tether-rag:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-to-kubernetes:
    name: Deployment to Kubernetes
    runs-on: ubuntu-latest
    needs: [containerize-and-publish]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure Kubectl Connection
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy Cluster Pods
        run: |
          cd deploy/k8s/tether-rag
          kustomize edit set image tether-rag=ghcr.io/${{ github.repository }}/tether-rag:${{ github.sha }}
          kubectl apply -k .
          kubectl rollout status deployment/tether-rag -n daisy-prod --timeout=300s
