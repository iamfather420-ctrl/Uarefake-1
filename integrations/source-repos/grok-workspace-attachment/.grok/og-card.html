<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Syne;
        src: url("./fonts/Syne-Variable.ttf") format("truetype");
        font-weight: 100 800;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("./fonts/IBMPlexMono-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 2400px;
        height: 1260px;
        overflow: hidden;
        background: #070708;
      }
      .card {
        position: relative;
        width: 2400px;
        height: 1260px;
        background: #070708 url("./og-bg.jpg") center / cover no-repeat;
      }
      .veil {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 58% 48% at 50% 50%,
          rgba(7, 7, 8, 0.78) 0%,
          rgba(7, 7, 8, 0.48) 38%,
          rgba(7, 7, 8, 0.16) 68%,
          transparent 100%
        );
      }
      .lockup {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 1680px;
        text-align: center;
      }
      .wordmark {
        position: relative;
        display: inline-block;
        font-family: Syne, sans-serif;
        font-weight: 800;
        font-size: 214px;
        letter-spacing: -0.042em;
        color: #f3f0e8;
        line-height: 0.88;
        text-shadow: 0 12px 56px rgba(7, 7, 8, 0.92);
      }
      .tag {
        margin-top: 44px;
        font-family: "IBM Plex Mono", monospace;
        font-weight: 400;
        font-size: 28px;
        letter-spacing: 0.22em;
        line-height: 1.4;
        color: rgba(243, 240, 232, 0.72);
        text-transform: uppercase;
      }
      .stamp {
        position: absolute;
        right: -248px;
        top: 58%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transform: rotate(-12deg);
        border: 7px solid #e24a3a;
        color: #e24a3a;
        font-family: Syne, sans-serif;
        font-weight: 800;
        font-size: 40px;
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        line-height: 1;
        padding: 14px 26px 12px 20px;
        background: rgba(7, 7, 8, 0.42);
        box-shadow: 0 0 0 4px rgba(226, 74, 58, 0.16);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="veil"></div>
      <div class="lockup">
        <div class="wordmark">
          UAREFAKE
          <span class="stamp">ENGINE</span>
        </div>
        <div class="tag">a machine you enter</div>
      </div>
    </div>
  </body>
</html>
