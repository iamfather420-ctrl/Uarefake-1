<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anonymous Identity & Financial</title>
    <script>
      // Prevent libraries from crashing when trying to overwrite read-only window.fetch
      (function() {
        try {
          const originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function() { console.warn('Blocked attempt to overwrite window.fetch'); },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('WAR-HIVE OS: Manual fetch protection bypassed or unsupported.');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
