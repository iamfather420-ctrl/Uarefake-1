name: Planetary Harvester Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Architecture
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Core Dependencies
        run: sudo apt-get update && sudo apt-get install -y ccache git libffi-dev libssl-dev autoconf automake libtool openjdk-17-jdk unzip zip

      - name: Formulate Required Assets
        run: |
          pip install Pillow
          python generate_assets.py

      - name: Install Buildozer Framework
        run: pip install buildozer cython virtualenv

      - name: Execute Android APK Target Extraction
        run: yes | buildozer android debug

      - name: Secure Build Artifact Extraction
        uses: actions/upload-artifact@v4
        with:
          name: Planetary-Harvester-APK
          path: bin/*.apk
