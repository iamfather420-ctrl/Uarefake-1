name: Ubuntu Cloud Build (APK)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository Consensus
      uses: actions/checkout@v4

    - name: Setup Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install

    - name: Build React App
      run: npm run build

    - name: Add Android & Sync Capacitor
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android

    - name: Execute Gradle Assemble Debug
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean assembleDebug --stacktrace --no-build-cache --no-daemon

    - name: Upload Compiled APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SolveX-React-APK
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 7

