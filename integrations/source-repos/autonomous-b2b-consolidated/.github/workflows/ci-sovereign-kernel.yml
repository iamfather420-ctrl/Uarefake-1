name: "CI/CD: Sovereign Kernel"

on:
  push:
    branches: [ "main", "release/*" ]
    paths:
      - 'deploy/services/sovereign-kernel/**'
      - 'src/**'
      - 'package.json'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'deploy/services/sovereign-kernel/**'
      - 'src/**'
      - 'package.json'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  code-quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Base Dependencies
        run: npm ci

      - name: Run Linter / Typecheck
        run: npm run lint

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-sast:
    name: Dependency Audit & SAST Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  test-unit-integration:
    name: Automated Unit & Integration Testing
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Tests & Generate Coverage
        run: npm test -- --coverage --passWithNoTests

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-kernel-coverage
          path: coverage/

  containerize-and-publish:
    name: Secure Container Build & Publish
    runs-on: ubuntu-latest
    needs: [test-unit-integration, security-sast]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform Builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./deploy/services/sovereign-kernel/
          file: ./deploy/services/sovereign-kernel/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/sovereign-kernel:latest
            ghcr.io/${{ github.repository }}/sovereign-kernel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scan on Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/sovereign-kernel:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-to-kubernetes:
    name: Canary Deployment to Kubernetes
    runs-on: ubuntu-latest
    needs: [containerize-and-publish]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure Kubectl Connection
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy Canary Pods
        run: |
          cd deploy/k8s/sovereign-kernel
          kustomize edit set image sovereign-kernel=ghcr.io/${{ github.repository }}/sovereign-kernel:${{ github.sha }}
          kubectl apply -k .
          kubectl rollout status deployment/sovereign-kernel -n daisy-prod --timeout=300s
