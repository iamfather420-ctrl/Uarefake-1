name: "CI/CD: JIT Binary Obfuscator"

on:
  push:
    branches: [ "main", "release/*" ]
    paths:
      - 'deploy/services/jit-obfuscator/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'deploy/services/jit-obfuscator/**'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  golang-lint-and-test:
    name: Go Lint, Format, Audit & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run Go Format Check
        run: |
          if [ -n "$(gofmt -l deploy/services/jit-obfuscator/)" ]; then
            echo "Go files are not formatted correctly. Run gofmt -w ."
            exit 1
          fi

      - name: Install Govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Govulncheck
        run: govulncheck ./deploy/services/jit-obfuscator/... || true

      - name: Run Go Unit Tests
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./deploy/services/jit-obfuscator/... || true

  containerize-and-publish:
    name: Secure Container Build & Publish
    runs-on: ubuntu-latest
    needs: [golang-lint-and-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./deploy/services/jit-obfuscator/
          file: ./deploy/services/jit-obfuscator/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/jit-obfuscator:latest
            ghcr.io/${{ github.repository }}/jit-obfuscator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scan on Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/jit-obfuscator:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-to-kubernetes:
    name: Deployment to Kubernetes
    runs-on: ubuntu-latest
    needs: [containerize-and-publish]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure Kubectl Connection
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy Cluster Pods
        run: |
          cd deploy/k8s/jit-obfuscator
          kustomize edit set image jit-obfuscator=ghcr.io/${{ github.repository }}/jit-obfuscator:${{ github.sha }}
          kubectl apply -k .
          kubectl rollout status deployment/jit-obfuscator -n daisy-prod --timeout=300s
